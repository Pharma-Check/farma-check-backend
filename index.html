<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferência de Controlados</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-[#0f141c] text-slate-100 font-sans min-h-screen p-4 flex flex-col items-center">

    <main class="w-full max-w-md bg-[#161f2c] border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-5 relative">
        <!-- Botão de Configuração (Engrenagem) -->
        <button onclick="toggleConfig()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-200 transition text-lg">
            <i class="fas fa-cog"></i>
        </button>

        <!-- Cabeçalho -->
        <div>
            <h1 class="text-xl font-bold text-slate-100 tracking-tight">Conferência de Controlados</h1>
            <p class="text-xs text-slate-400 mt-1">Tire uma foto da receita para conferir com a Portaria 344/98, RDC 20/2011 e RDC 973/2025.</p>
        </div>

        <!-- Painel Oculto de Configuração do Servidor -->
        <div id="config-panel" class="hidden bg-[#0f141c] border border-slate-700 p-3 rounded-xl space-y-2">
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">Endereço do Servidor (API URL)</label>
            <input type="text" id="server-url" value="https://onrender.com" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs font-mono text-slate-200 focus:outline-none focus:ring-1 focus:ring-emerald-500">
        </div>

        <!-- Área de Upload / Câmera Integrada -->
        <div class="w-full aspect-[4/3] bg-[#0f141c] border border-dashed border-slate-700 rounded-xl overflow-hidden flex flex-col items-center justify-center relative cursor-pointer group" onclick="document.getElementById('file-input').click()">
            <input type="file" id="file-input" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
            
            <div id="upload-placeholder" class="flex flex-col items-center space-y-2 text-slate-500 group-hover:text-slate-400 transition">
                <i class="fas fa-camera text-4xl"></i>
                <span class="text-xs font-medium">Toque para Tirar Foto da Receita</span>
            </div>
            
            <img id="image-preview" class="hidden w-full h-full object-contain">
        </div>

        <!-- Botões de Ação -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="document.getElementById('file-input').click()" class="bg-[#1f2b3e] hover:bg-[#28374f] text-slate-300 font-bold py-3.5 rounded-xl transition text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                <i class="fas fa-retweet"></i> Tirar / trocar foto
            </button>
            <button onclick="analyzeRecipe()" id="btn-analyze" class="bg-[#38bdf8] hover:bg-[#0ea5e9] text-slate-950 font-black py-3.5 rounded-xl transition text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-sky-500/10">
                <i class="fas fa-wand-magic-sparkles"></i> Analisar
            </button>
        </div>

        <!-- Painel de Resultados Dinâmicos -->
        <div id="result-panel" class="hidden border p-4 rounded-xl space-y-3 transition-all duration-300">
            <div class="flex items-center gap-2 border-b pb-2" id="result-header border-slate-700">
                <span id="result-badge" class="text-xs font-black uppercase tracking-wider px-2 py-0.5 rounded-md"></span>
            </div>
            <p id="result-text" class="text-xs leading-relaxed text-slate-200 font-medium whitespace-pre-line"></p>
        </div>
    </main>

    <script>
        let base64Image = "";

        function toggleConfig() {
            const panel = document.getElementById('config-panel');
            panel.classList.toggle('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // Exibe o preview visual na tela
                const img = document.getElementById('image-preview');
                const placeholder = document.getElementById('upload-placeholder');
                img.src = e.target.result;
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');

                // Lógica de Redução e Compactação da Foto para evitar estouro de banda no Render
                const imageElement = new Image();
                imageElement.src = e.target.result;
                imageElement.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200; // Resolução ideal para OCR sem pesar megabytes
                    let width = imageElement.width;
                    let height = imageElement.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(imageElement, 0, 0, width, height);
                    
                    // Converte para Base64 ultra leve com 70% de qualidade JPEG
                    base64Image = canvas.toDataURL('image/jpeg', 0.7);
                }
            }
            reader.readAsDataURL(file);
        }

        async function analyzeRecipe() {
            if (!base64Image) {
                alert("Por favor, capture ou selecione uma foto da receita primeiro.");
                return;
            }

            const btn = document.getElementById('btn-analyze');
            const resultPanel = document.getElementById('result-panel');
            const resultBadge = document.getElementById('result-badge');
            const resultText = document.getElementById('result-text');
            const serverUrl = document.getElementById('server-url').value.trim();

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Processando...`;
            resultPanel.classList.add('hidden');

            try {
                const response = await fetch(`${serverUrl}/api/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                const data = await response.json();
                resultPanel.classList.remove('hidden');

                if (data.success) {
                    if (data.hasAlert) {
                        resultPanel.className = "bg-amber-950/40 border-amber-800/80 p-4 rounded-xl space-y-3 transition-all";
                        resultBadge.className = "bg-amber-900 text-amber-300 text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md border border-amber-700";
                        resultBadge.innerText = "🔴 Conferência Obrigatória";
                    } else {
                        resultPanel.className = "bg-emerald-950/40 border-emerald-800/80 p-4 rounded-xl space-y-3 transition-all";
                        resultBadge.className = "bg-emerald-900 text-emerald-300 text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md border border-emerald-700";
                        resultBadge.innerText = "✓ Triagem OK";
                    }
                    resultText.innerText = data.message;
                } else {
                    throw new Error(data.error || "Erro desconhecido no processamento do motor.");
                }
            } catch (error) {
                resultPanel.classList.remove('hidden');
                resultPanel.className = "bg-red-950/40 border-red-800/80 p-4 rounded-xl space-y-2 transition-all";
                resultBadge.className = "bg-red-900 text-red-300 text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md border border-red-700";
                resultBadge.innerText = "⚠️ Erro de Leitura";
                resultText.innerText = `Não foi possível analisar a receita: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-wand-magic-sparkles"></i> Analisar`;
            }
        }
    </script>
</body>
</html>
